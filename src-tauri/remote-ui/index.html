<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>HEART Remote</title>
    <link rel="stylesheet" href="/remote/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="heart">♥</div>
        <div class="brand">HEART<small>Android REMOTE</small></div>
        <div class="online"><i></i><span id="hostLabel">CONNECTED</span></div>
      </header>
      <main>
        <section id="libraryView" class="view active">
          <div class="hero">
            <div>
              <div class="eyebrow">YOUR HEART, IN YOUR HAND</div>
              <h1>작품 선택</h1>
            </div>
            <div class="count" id="libraryCount">불러오는 중</div>
          </div>
          <div class="search-wrap">
            <input
              id="search"
              class="search"
              type="search"
              role="combobox"
              placeholder="작품명 · 태그 검색"
              autocomplete="off"
              aria-label="라이브러리 검색"
              aria-autocomplete="list"
              aria-controls="searchSuggestions"
              aria-expanded="false"
            />
            <div
              id="searchSuggestions"
              class="suggestions"
              role="listbox"
              aria-label="태그 자동완성 및 연관 태그"
            ></div>
          </div>
          <div id="chips" class="chips"></div>
          <div id="grid" class="grid">
            <div class="empty" style="grid-column: 1/-1">
              <b>HEART 동기화 중</b>노트북 라이브러리를 불러오고 있습니다.
            </div>
          </div>
        </section>
        <section id="remoteView" class="view">
          <div class="remote-top">
            <button id="showHeart">♥ HEART</button
            ><button id="refreshScreen">화면 새로고침</button
            ><button id="enterFullscreen">전체 화면</button
            ><button id="stopItem" class="danger">작품 종료</button>
          </div>
          <div class="screen-shell">
            <img id="screen" alt="노트북 화면" />
            <div id="screenState" class="screen-state">
              노트북 화면을 연결하는 중…
            </div>
            <div id="streamMetrics" class="stream-metrics" aria-live="polite">
              스트림 준비 중
            </div>
          </div>
          <button id="exitFullscreen" class="fullscreen-exit">
            전체 화면 종료
          </button>
          <div class="hint">
            <b>빠른 한 손가락 좌우</b>는 방향키 · <b>상하</b>는 스크롤 ·
            <b>길게 누른 뒤 이동</b>은 마우스 드래그
          </div>
          <div class="controls">
            <div class="utility-keys">
              <button class="key" data-key="escape">ESC</button
              ><button class="key" data-key="enter">ENTER</button
              ><button class="key" data-key="space">SPACE</button>
            </div>
            <div class="control-main">
              <div class="dpad" aria-label="방향키">
                <button class="key up" data-key="up">↑</button
                ><button class="key left" data-key="left">←</button>
                <div class="center">＋</div>
                <button class="key right" data-key="right">→</button
                ><button class="key down" data-key="down">↓</button>
              </div>
              <div class="action-keys">
                <button class="key wide" data-action="right">우클릭</button
                ><button class="key" data-action="scrollUp">스크롤 ↑</button
                ><button class="key" data-action="scrollDown">스크롤 ↓</button
                ><button id="toggleSwipeDirection" class="key wide" type="button">
                  스와이프 반전: 끔
                </button
                ><button class="key wide red" data-action="keyboard">
                  문자 입력
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <nav>
      <button class="active" data-view="library">
        <span>♥</span><br />LIBRARY</button
      ><button data-view="remote"><span>●</span><br />REMOTE</button>
    </nav>
    <div id="toast" class="toast"></div>
    <div id="textModal" class="modal">
      <div class="sheet">
        <h3>노트북에 문자 입력</h3>
        <input id="textInput" placeholder="한글과 영문을 입력할 수 있습니다" />
        <div class="sheet-actions">
          <button id="cancelText">취소</button
          ><button id="sendText" class="send">전송</button>
        </div>
      </div>
    </div>
    <script type="module" src="/remote/app.js"></script>
  </body>
</html>
